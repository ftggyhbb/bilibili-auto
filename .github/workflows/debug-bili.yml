name: Debug Bili
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: variants
        env:
          SESSDATA: ${{ secrets.SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
          DEDEUSERID: ${{ secrets.DEDEUSERID }}
          BILI_FULL: ${{ secrets.BILI_FULL }}
        run: |
          pip install requests -q
          python - <<'PY'
          import os, requests
          print("lens:", len(os.environ["SESSDATA"]), len(os.environ["BILI_JCT"]), len(os.environ["DEDEUSERID"]), len(os.environ["BILI_FULL"]))
          base = "buvid3=DFD9F708-27C3-3EC4-E931-B2092F5E6C8739836infoc; buvid4=84A5C4AA-4B89-21A1-81BA-BFB725C7ACB841859-026100902-ekiSQ5TsKey9VUj3JowAqA%3D%3D; buvid_fp=c4f31a6181c3a583815f4fa6e3a976f7; b_nut=1791484839"
          cookieA = "SESSDATA=%s; bili_jct=%s; DedeUserID=%s; %s" % (os.environ["SESSDATA"], os.environ["BILI_JCT"], os.environ["DEDEUSERID"], base)
          ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          variants = {
            "A_prod": {"User-Agent": "Mozilla/5.0", "Cookie": cookieA, "Referer": "https://www.bilibili.com/"},
            "B_full": {"User-Agent": "Mozilla/5.0", "Cookie": os.environ["BILI_FULL"], "Referer": "https://www.bilibili.com/"},
            "C_fullreal": {"User-Agent": ua, "Cookie": os.environ["BILI_FULL"], "Referer": "https://www.bilibili.com/", "Accept": "application/json, text/plain, */*", "Accept-Language": "zh-CN,zh;q=0.9", "Origin": "https://www.bilibili.com"},
          }
          for name, h in variants.items():
              try:
                  r = requests.get("https://api.bilibili.com/x/web-interface/nav", headers=h, timeout=20)
                  j = r.json()
                  d = j.get("data") or {}
                  print("RESULT", name, "HTTP", r.status_code, "code", j.get("code"), "msg", j.get("message"), "uname", d.get("uname"), "region", d.get("ip_region"))
              except Exception as e:
                  print("RESULT", name, "ERR", repr(e))
          PY
